apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skillpath-ingress
  namespace: skillpath
  labels:
    app: skillpath
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.skillpath.example.com
      secretName: skillpath-tls
  rules:
    - host: api.skillpath.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skillpath-api
                port:
                  name: http
