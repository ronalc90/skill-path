apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillpath-api
  namespace: skillpath
  labels:
    app: skillpath
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skillpath
      component: api
  template:
    metadata:
      labels:
        app: skillpath
        component: api
    spec:
      serviceAccountName: skillpath-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: skillpath-api
          image: ghcr.io/ronalc90/skill-path:latest
          ports:
            - containerPort: 3005
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: skillpath-config
            - secretRef:
                name: skillpath-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: app-data
              mountPath: /app/data
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: skillpath-data-pvc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skillpath-sa
  namespace: skillpath
  labels:
    app: skillpath
