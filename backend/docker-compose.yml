version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: skillpath-db
    environment:
      POSTGRES_USER: skillpath
      POSTGRES_PASSWORD: skillpath123
      POSTGRES_DB: skillpath
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillpath"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillpath-api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=skillpath
      - DB_PASSWORD=skillpath123
      - DB_NAME=skillpath
      - DB_SSLMODE=disable
      - SERVER_PORT=8080
      - GIN_MODE=release
      - JWT_SECRET=your-production-secret-change-me
      - JWT_EXPIRY_HOURS=72
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
